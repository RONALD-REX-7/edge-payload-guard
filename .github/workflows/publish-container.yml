name: Publish GHCR container

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semantic version to publish (must match pyproject.toml), e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Resolve and verify release version
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requested="${RELEASE_TAG_INPUT#v}"
            if [[ "$requested" != "$project_version" ]]; then
              echo "Requested version $requested does not match pyproject.toml ($project_version)"
              exit 1
            fi
          fi
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject.toml must contain a semantic version such as 1.0.0"
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "Verified release version $project_version"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build container for smoke test
        run: docker build --tag edge-payload-guard:release-check .
      - name: Smoke-test container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/examples:/examples:ro" \
            edge-payload-guard:release-check \
            --schema /examples/telemetry.schema.json \
            --payload /examples/telemetry.valid.json

  publish:
    name: Publish linux/amd64 and linux/arm64
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="${IMAGE,,}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --push .
