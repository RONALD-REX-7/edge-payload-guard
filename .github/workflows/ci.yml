name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI version
        run: edge-payload-guard --version
      - name: Validate known-good example
        run: edge-payload-guard --schema examples/telemetry.schema.json --payload examples/telemetry.valid.json
      - name: Check invalid example exit code
        shell: bash
        run: |
          set +e
          edge-payload-guard --schema examples/telemetry.schema.json --payload examples/telemetry.invalid.json
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "Expected exit code 1; received $status"
            exit 1
          fi

  container-smoke:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build image
        run: docker build --tag edge-payload-guard:ci .
      - name: Validate example in container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/examples:/examples:ro" \
            edge-payload-guard:ci \
            --schema /examples/telemetry.schema.json \
            --payload /examples/telemetry.valid.json
      - name: Confirm invalid example fails in container
        shell: bash
        run: |
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/examples:/examples:ro" \
            edge-payload-guard:ci \
            --schema /examples/telemetry.schema.json \
            --payload /examples/telemetry.invalid.json
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "Expected container exit code 1; received $status"
            exit 1
          fi
